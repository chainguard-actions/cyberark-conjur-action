name: Test action with self-signed certificate input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://conjur.invalid.example.com'
          account: 'myorg'
          host_id: 'host/github-action'
          api_key: 'fake-api-key'
          secrets: 'path/to/secret/value | MY_SECRET'
          certificate: |
            -----BEGIN CERTIFICATE-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAfakecertificatedata==
            -----END CERTIFICATE-----

      - name: Assert action ran with certificate input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action receives the certificate input and passes it to the
          # entrypoint. With an unreachable URL, curl fails silently and the
          # script exits 0. A non-skipped outcome confirms the Docker image
          # built and the entrypoint ran with the certificate argument passed.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME' (certificate input accepted)"
