name: Test authn_token_file input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass the 'authn_token_file' input to exercise the token-file auth path.
      # An invalid env var name in secrets (contains '=') causes the action to
      # exit 1 after env var validation — this is the reliable failure trigger
      # used to confirm the action ran and processed all inputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "https://conjur.invalid.example.com"
          account: "myorg"
          authn_token_file: "/tmp/conjur-authn-token"
          secrets: "path/to/secret|INVALID=VAR"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid env var name (authn_token_file path), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid env var name in secrets spec (authn_token_file input)"
