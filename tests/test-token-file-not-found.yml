name: Test authn_token_file not found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Conjur server
        run: |
          python3 - << 'PYEOF' &
          import http.server, socketserver

          class ConjurHandler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(n)
                  body = b'ZmFrZXRva2Vu'
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  body = b'Malformed authorization token'
                  self.send_response(401)
                  self.send_header('Content-Type', 'text/plain')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

          socketserver.TCPServer.allow_reuse_address = True
          with socketserver.TCPServer(('0.0.0.0', 7779), ConjurHandler) as httpd:
              httpd.serve_forever()
          PYEOF
          echo $! > /tmp/mock_conjur_7779.pid
          sleep 2
          echo "Mock server started on port 7779"

      - name: Get Docker bridge host IP
        id: hostip
        run: |
          HOST_IP=$(ip route | awk '/default/ {print $3}' | head -1)
          if [ -z "$HOST_IP" ]; then
            HOST_IP="172.17.0.1"
          fi
          echo "host_ip=$HOST_IP" >> $GITHUB_OUTPUT
          echo "Host IP for Docker containers: $HOST_IP"

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://${{ steps.hostip.outputs.host_ip }}:7779"
          account: "myaccount"
          authn_token_file: "/nonexistent/path/to/token.json"
          secrets: "db/password"

      - name: Stop mock server
        if: always()
        run: |
          if [ -f /tmp/mock_conjur_7779.pid ]; then
            kill $(cat /tmp/mock_conjur_7779.pid) 2>/dev/null || true
          fi

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when token file does not exist"
            exit 1
          fi
          echo "PASS: action failed as expected when token file not found"
