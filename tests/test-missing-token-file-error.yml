name: Test action runs with missing authn token file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent token file
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://127.0.0.1:19999"
          account: "myaccount"
          authn_token_file: "/tmp/nonexistent-conjur-token-file.json"
          secrets: "db/password"

      - name: Assert action completed (missing token file does not crash the script)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to complete even with missing token file, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action completed without crashing when authn_token_file does not exist"
