name: Test JWT authentication path fails on invalid env var name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Attempt JWT-based authentication with an invalid env var name in secrets.
      # The authn_id input selects the JWT authenticator path.
      # curl failures against the invalid URL are silent, but the env var
      # validation check (refusing names containing '=') reliably causes exit 1.
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "https://conjur.invalid.example.com"
          account: "myorg"
          authn_id: "my-jwt-service"
          secrets: "path/to/secret|INVALID=VAR"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid env var name (JWT auth path), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid env var name in secrets spec (JWT auth)"
