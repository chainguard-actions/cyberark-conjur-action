name: Test invalid Conjur URL error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build local conjur-action image
        run: |
          ACTION_DIR="$GITHUB_WORKSPACE/pristine/cyberark--conjur-action/v2.1.0"
          if [ ! -f "$ACTION_DIR/Dockerfile" ]; then
            ACTION_DIR="$GITHUB_WORKSPACE"
          fi
          echo "Building from: $ACTION_DIR"
          docker build -t cyberark/conjur-action:2.1.0 "$ACTION_DIR"

      - name: Start mock Conjur server returning malformed token error
        run: |
          python3 - <<'EOF' &
          import http.server, socketserver

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = b'Malformed authorization token'
                  self.send_response(401)
                  self.send_header('Content-Type', 'text/plain')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  body = b'Malformed authorization token'
                  self.send_response(401)
                  self.send_header('Content-Type', 'text/plain')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, fmt, *args):
                  pass

          socketserver.TCPServer.allow_reuse_address = True
          with socketserver.TCPServer(('0.0.0.0', 18080), Handler) as httpd:
              httpd.serve_forever()
          EOF
          sleep 2
          curl -s http://localhost:18080/ || true
          echo "Mock server started on port 18080"

      - name: Get Docker bridge host IP
        id: hostip
        run: |
          HOST_IP=$(docker network inspect bridge --format='{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null | head -1)
          if [ -z "$HOST_IP" ]; then
            HOST_IP=$(ip addr show docker0 2>/dev/null | grep 'inet ' | awk '{print $2}' | cut -d/ -f1)
          fi
          if [ -z "$HOST_IP" ]; then
            HOST_IP="172.17.0.1"
          fi
          echo "host_ip=$HOST_IP" >> "$GITHUB_OUTPUT"
          echo "Detected Docker bridge IP: $HOST_IP"

      - name: Run action with invalid credentials and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          url: 'http://${{ steps.hostip.outputs.host_ip }}:18080'
          account: 'myaccount'
          host_id: 'host/github-action'
          api_key: 'invalidapikey'
          secrets: 'path/to/secret/value | MY_SECRET'

      - name: Assert action failed due to malformed authorization token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid credentials"
