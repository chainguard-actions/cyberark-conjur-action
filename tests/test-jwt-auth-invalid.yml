name: Test JWT auth path with invalid env var name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-pull or build conjur-action Docker image
        run: |
          docker pull cyberark/conjur-action:2.2.2 || \
            docker build -t cyberark/conjur-action:2.2.2 . || \
            echo "Warning: could not pre-pull or build image, will attempt pull during action step"

      - name: Run action with JWT authn_id and invalid env var name (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://127.0.0.1:19999"
          account: "myorg"
          authn_id: "my-jwt-service"
          secrets: "path/to/secret=value"

      - name: Assert action did not succeed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail due to invalid env var name in JWT auth path, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed when secret path produces invalid env var name via JWT auth path (outcome: $OUTCOME)"
