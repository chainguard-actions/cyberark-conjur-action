name: Test invalid inputs cause action failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Attempt to fetch a secret using an invalid env var name (contains '=').
      # The action validates env var names and exits 1 when the name is invalid.
      # curl failures against the invalid URL are silent, but the env var
      # validation check runs after curl and reliably causes exit 1.
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "https://conjur.invalid.example.com"
          account: "myorg"
          host_id: "host/github-action"
          api_key: "invalidapikey"
          secrets: "path/to/secret|INVALID=VAR"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid inputs, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid env var name in secrets spec"
