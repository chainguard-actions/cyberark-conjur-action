name: Test certificate and audience inputs (expect failure - no real Conjur server)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-pull or build conjur-action Docker image
        run: |
          docker pull cyberark/conjur-action:2.2.2 || \
            docker build -t cyberark/conjur-action:2.2.2 . || \
            echo "Warning: could not pre-pull or build image, will attempt pull during action step"

      - name: Run action with certificate and audience inputs (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://127.0.0.1:19999"
          account: "myorg"
          authn_id: "my-jwt-service"
          secrets: "path/to/secret=MY_SECRET"
          certificate: |
            -----BEGIN CERTIFICATE-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0Z3VS5JJcds3xHn/ygWe
            dummycertificatecontentfortest1234567890abcdefghijklmnopqrstuvwxyz
            -----END CERTIFICATE-----
          audience: "my-custom-audience"

      - name: Assert action did not succeed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail (no real Conjur server), but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed when using certificate and audience inputs with no real Conjur server (outcome: $OUTCOME)"
