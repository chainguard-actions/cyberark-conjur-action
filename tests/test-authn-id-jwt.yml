name: Test action with authn_id (JWT authenticator)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://127.0.0.1:19999"
          account: "myaccount"
          authn_id: "my-jwt-service"
          secrets: "db/password | DB_PASSWORD"

      - name: Assert action completes when authn_id is provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With authn_id set and an unreachable URL:
          # - The action attempts JWT authentication against the unreachable endpoint
          # - curl fails (connection refused) → empty token
          # - curl to fetch secrets also fails → empty secretVal
          # - Empty secretVal does not match error conditions → action exits 0
          # Expected outcome: success (exit 0)
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (exit 0) with authn_id set, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action completed successfully with authn_id input"
