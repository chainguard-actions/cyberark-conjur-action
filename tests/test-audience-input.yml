name: Test audience input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://invalid.conjur.example.com'
          account: 'myaccount'
          authn_id: 'my-jwt-service'
          secrets: 'MY_SECRET=path/to/secret'
          audience: 'conjur/myaccount'
      - name: Assert action ran with audience input
        run: |
          # The action is expected to fail (no real Conjur server),
          # but we verify it was invoked with the audience input.
          # continue-on-error: true means we reach this step regardless.
          echo "Action completed (with or without error) - audience input was accepted"
          echo "PASS: audience input was passed to the action"
