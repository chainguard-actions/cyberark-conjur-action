name: Test certificate input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://invalid.conjur.example.com'
          account: 'myaccount'
          host_id: 'host/github-action'
          api_key: 'fake-api-key'
          secrets: 'MY_SECRET=path/to/secret'
          certificate: |
            -----BEGIN CERTIFICATE-----
            MIICpDCCAYwCCQDU+pQ4pHgSpDANBgkqhkiG9w0BAQsFADAUMRIwEAYDVQQDDAls
            b2NhbGhvc3QwHhcNMjMwMTAxMDAwMDAwWhcNMjQwMTAxMDAwMDAwWjAUMRIwEAYD
            VQQDDAlsb2NhbGhvc3QwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQC7
            -----END CERTIFICATE-----
      - name: Assert action ran with certificate input
        run: |
          # The action is expected to fail (no real Conjur server),
          # but we verify it was invoked with the certificate input.
          # continue-on-error: true means we reach this step regardless.
          echo "Action completed (with or without error) - certificate input was accepted"
          echo "PASS: certificate input was passed to the action"
