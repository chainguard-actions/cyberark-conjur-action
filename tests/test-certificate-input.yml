name: Test certificate input is accepted (self-signed SSL cert path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass the 'certificate' input to exercise the self-signed SSL cert path.
      # An invalid env var name in secrets (contains '=') causes the action to
      # exit 1 after env var validation — this is the reliable failure trigger
      # used to confirm the action ran and processed all inputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "https://conjur.invalid.example.com"
          account: "myorg"
          host_id: "host/github-action"
          api_key: "invalidapikey"
          certificate: |
            -----BEGIN CERTIFICATE-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000000000000000000=
            -----END CERTIFICATE-----
          secrets: "path/to/secret|INVALID=VAR"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid env var name (certificate input path), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid env var name in secrets spec (certificate input)"
