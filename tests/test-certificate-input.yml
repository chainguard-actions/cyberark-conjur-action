name: Test certificate input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with certificate input (expect failure due to invalid URL)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: https://conjur.invalid.example.com
          account: myaccount
          host_id: host/github-action
          api_key: invalidapikey
          secrets: myapp/db/password
          certificate: |
            -----BEGIN CERTIFICATE-----
            MIICpDCCAYwCCQDU+pQ4pHgSpDANBgkqhkiG9w0BAQsFADAUMRIwEAYDVQQDDAls
            b2NhbGhvc3QwHhcNMjMwMTAxMDAwMDAwWhcNMjQwMTAxMDAwMDAwWjAUMRIwEAYD
            VQQDDAlsb2NhbGhvc3QwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQC7
            o4qne60TB3pOGHBBMTMoMDMzMDMzMDMzMDMzMDMzMDMzMDMzMDMzMDMzMDMzMDMz
            -----END CERTIFICATE-----
      - name: Assert action failed (invalid URL with certificate)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid URL, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid URL with certificate input"
