name: Test action with authn_token_file input (token file auth)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake authn token file
        run: |
          mkdir -p /tmp/conjur-auth
          echo '{"protected":"fake","payload":"fake","signature":"fake"}' > /tmp/conjur-auth/token.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://conjur.invalid.example.com'
          account: 'myorg'
          authn_token_file: '/tmp/conjur-auth/token.json'
          secrets: 'path/to/secret/value | MY_SECRET'

      - name: Assert action ran with authn_token_file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action receives the authn_token_file input and attempts to use it.
          # With an unreachable URL, curl fails silently and the script exits 0.
          # A non-skipped outcome confirms the Docker image built and the
          # entrypoint ran with the authn_token_file argument passed correctly.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME' (authn_token_file input accepted)"
