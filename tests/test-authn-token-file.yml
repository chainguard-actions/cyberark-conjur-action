name: Test authn_token_file path completes without crash
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake authn token file
        run: |
          mkdir -p /tmp/conjur
          echo '{"protected":"fake","payload":"fake","signature":"fake"}' > /tmp/conjur/authn_token.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://conjur.invalid.example.com'
          account: 'myorg'
          authn_token_file: '/tmp/conjur/authn_token.json'
          secrets: 'MY_SECRET=path/to/secret/value'

      - name: Assert action did not crash (outcome is success or failure, not cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action completed with outcome '$OUTCOME' (authn_token_file path)"
